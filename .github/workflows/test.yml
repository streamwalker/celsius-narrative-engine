name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  comic-bubbles:
    name: comic-bubbles unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run comic-bubbles tests
        run: bunx vitest run src/test/comic-bubbles.test.ts --reporter=verbose
