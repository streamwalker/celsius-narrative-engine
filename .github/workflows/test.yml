name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: comic-bubbles + letter-page-panels + PanelBubbleEditor unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bunx vitest run src/test/comic-bubbles.test.ts src/test/letter-page-panels.test.ts src/test/PanelBubbleEditor.test.tsx --reporter=verbose
