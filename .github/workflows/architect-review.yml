name: Story Architect review

on:
  push:
    branches: [feat/story-world-architect]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architect-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all unit and component tests
        run: bun run test
      - name: Check TypeScript
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: Lint Story Architect
        run: node node_modules/eslint/bin/eslint.js src/lib/architect/*.ts src/pages/StoryArchitect.tsx src/test/architect.test.ts src/test/StoryArchitect.test.tsx
      - name: Build production assets
        run: bun run build
