name: Story Architect review

on:
  push:
    branches: [feat/story-world-architect]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check application
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Run all unit and integration tests
        run: bunx vitest run
      - name: Build production assets
        run: bun run build
      - name: Package source for review
        run: tar --exclude=./.git --exclude=./.env --exclude='./.env.*' --exclude=./node_modules --exclude=./dist -czf /tmp/celsius-review-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: celsius-review-source
          path: /tmp/celsius-review-source.tgz
          retention-days: 3
